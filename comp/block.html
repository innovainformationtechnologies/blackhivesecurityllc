Args: id, text
--------------------------------------->

<div class="block_container">
    <div class="block_body">
        <p class="text"></p>
    </div>
    <style>
        .block_body{
            width: 90vw;
            height: auto;
            object-fit: cover;
            border-radius: 1rem;
            margin: auto;
            font-size: var(--font_size_h2);
        }
    </style>
    <script>
        (function(){
            function init(data){
                const element = document.getElementById(`${data.id}`)
                element.querySelector(".text").innerText = data.text
            }

            window.componentRegistry.register("block", init)
        })()
    </script>
</div>
