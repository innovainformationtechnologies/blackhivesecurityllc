<div class="contact_card_container">
    <div id="contact_card" class="contact_card_body flex row swap">
        <img class="contact_card_image" src="static/innova_logo.png" alt="service image">
        <div>
            <h1 class="text1">Service 1: Website Development</h1>
            <p class="text2">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed sit amet nulla eget elit dictum varius. Maecenas risus mi, porta mattis nulla vitae, ultricies lorem.
            </p>
            <div class="cta">
                <a class="btn btn-lg btn-primary" href="mailto:info@example.com">Get in touch</a>
            </div>
        </div>
    </div>
    <style>
        .contact_card_container{
            max-width: 80vw !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: auto auto;
            border-radius: 1rem;
            transition: all 0.5s ease-in-out;
            &:hover{
                transform: scale(1.05);
            }
        }
        
        .contact_card_body{
            /* max-width: 30vw !important; */
            width: fit-content;
            
            height: 100%;
            margin: auto;
            gap: 3rem;
            & > * > h1{
                font-size: var(--font_size_h1) !important;
            }
            & > * > p{
                opacity: 80%;
                font-size: var(--font_size_base);
                /* max-width: 80vw; */
            }

        }
        .contact_card_image{
            /* position: relative; */
            height: 45rem;
            width: 50rem;
            object-fit: contain;
            /* border-radius: 1rem; */
        }
        .cta{
            margin: auto;
            & > a{
                font-size: 18px !important;
                
            }
            & > a:hover{
                border: 1px solid var(--accent_color);
            }
        }
        @media screen and (max-width: 1000px) {
            .contact_card_body{
                align-items: center;
                justify-items: center;
            }
            .contact_card_image{
                height: 40vh;
                width: 100%;
            }
        }
    </style>
    <script>
        (function(){

            function init(data){
                console.log("contact_card data ", data)
                const element = document.getElementById(`${data.id}`)
                element.querySelector(".text1").innerText = data.title
                element.querySelector(".text2").innerText = data.body
                element.querySelector(".cta").querySelector("a").href = data.cta_url
                element.querySelector(".cta").querySelector("a").innerText = data.cta
                element.querySelector(".contact_card_image").src = data.image_url
                console.log(window.innerWidth)
                element.style.margin = "auto";
                
                

            }
            

            window.componentRegistry.register("contact_card", init)
        })()
    </script>
</div>
