<div class="card_container">
    <div id="card" class="card_body">
        <img class="card_image" src="static/innova_logo.png" alt="service image">
        <div>
            <h1 class="text1">Service 1: Website Development</h1>
            <p class="text2">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed sit amet nulla eget elit dictum varius. Maecenas risus mi, porta mattis nulla vitae, ultricies lorem.
            </p>
            <div class="cta">
                <a class="btn btn-lg btn-primary" href="mailto:info@example.com">Get in touch</a>
            </div>
        </div>
    </div>
    <style>
        .card_container{
            max-width: fit-content;
            display: flex;
            flex-direction: column;
            justify-content: left;
            align-items: left;
            margin: auto auto;
            border-radius: 1rem;
            transition: all 0.5s ease-in-out;
            &:hover{
                transform: scale(1.05);
            }
        }
        
        .card_body{
            width: 80vw;
            height: 100%;
            margin: auto;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            & > * > h1{
                font-size: 44px !important;
            }
            & > * > p{
                opacity: 80%;
                width: 40rem;
                font-size: var(--font_size_base);
            }

        }
        .card_image{
            /* position: relative; */
            height: 45rem;
            width: 50rem;
            object-fit: contain;
            /* border-radius: 1rem; */
        }
        .cta{
            margin: auto;
            & > a{
                font-size: 18px !important;
                
            }
            & > a:hover{
                border: 1px solid var(--accent_color);
            }
        }
        @media screen and (max-width: 1000px) {
            .card_container{
                min-width: 80vw !important;
                max-height: none;
                max-width: none !important;
            }
            .card_body{
                flex-direction: column;
                & > * > p{
                    opacity: 80%;
                    width: 80vw;
                }
                & > * > h1{
                    // width: 80rem !important;
                }
            }
            .card_image{
                height: 40vh;
                width: 80vw;
            }
        }
    </style>
    <script>
        (function(){

            function init(data){
                console.log("card data ", data)
                const element = document.getElementById(`${data.id}`)
                element.querySelector(".text1").innerText = data.title
                element.querySelector(".text2").innerText = data.body
                element.querySelector(".cta").querySelector("a").href = data.cta_url
                element.querySelector(".cta").querySelector("a").innerText = data.cta
                element.querySelector(".card_image").src = data.image_url
                element.querySelector(".card_body").style.flexDirection = data.flex_direction
                console.log(window.innerWidth)
                element.style.width = "100%";
                
            }
            

            window.componentRegistry.register("card", init)
        })()
    </script>
</div>
