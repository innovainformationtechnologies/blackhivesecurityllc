<div class="banner_container">
	<div id="banner">
		<button id="banner_left" class="banner_btn"><</button>
		<div id="banner_text"></div>
		<button id="banner_right" class="banner_btn">></button>
	</div>
    <!-- <div class="header_body">
		<img src="" id="logo" alt="">
    </div> -->
    <style>
		#logo{
			height: 5rem;
			object-fit: contain;
		}
		.banner_body{
			display: flex;
			flex-direction: row;
			justify-content: space-between;
			align-items: center;
			padding: 1rem;
		}
		.banner_container{
			position: fixed;
			display: flex;
			flex-direction: column;
			background: transparent;
			top: 0px;
			left: 0;
			right: 0;
			width: 100vw;
			z-index: 100;
		}
		#banner{
			width: 100vw;
			display: flex;
			flex-direction: row;
			justify-content: space-between;
			align-items: center;
			background: var(--background);
			color: var(--text);
			padding: 1rem;
			&>button{
				background: none;
				border: none;
				font-size: 1.5rem;
				color: var(--primary_color);
				padding: 1rem 3rem;
			}
			&>#banner_text{
				transition: all 0.5s ease-in-out;
				font-size: var(--font_size_small);
				&.fade_out{
					opacity: 0;
				}
			}
		}
    </style>
    <script>
        (function(){
			let banner_messages = []
			let current_message = 0
			function get_banner_messages(element, data){
				Object.keys(data).forEach(key => {
					console.log(key)
					if(key.startsWith("banner_message_")){
						banner_messages.push(data[key])
					}
				})
				if(banner_messages.length > 0){
					element.querySelector("#banner_text").innerText = banner_messages[current_message]
				}
			}

			function  next_banner_message(element,dir){
				element.querySelector("#banner_text").classList.add("fade_out")
				setTimeout(() => {
					current_message += dir
					if(current_message >= banner_messages.length){
						current_message = 0
					}
					if(current_message < 0){
						current_message = banner_messages.length - 1
					}
					if(banner_messages.length > 0){
						element.querySelector("#banner_text").innerText = banner_messages[current_message]
					}
					element.querySelector("#banner_text").classList.remove("fade_out")
				}, 500);
			}

            function init(data){
                const element = document.getElementById(`${data.id}`)
				get_banner_messages(element, data)

				element.querySelector("#banner_left").addEventListener("click", () => {
					next_banner_message(element,-1)
				})

				element.querySelector("#banner_right").addEventListener("click", () => {
					next_banner_message(element,1)
				})
				element.querySelector("img").src = data.logo
				setInterval(() => {
					next_banner_message(element,1)
				}, 5000);
            }

            window.componentRegistry.register("banner", init)
        })()
    </script>
</div>
