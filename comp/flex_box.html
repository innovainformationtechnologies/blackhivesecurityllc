<div class="flex_row_container">
    <div id="flex_row" class="flex_row_body">
    </div>
    <style>
        .flex_box_container{
            width: 100%;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            &:last-child {
               align-self: center;
            }
        }
        .flex_box_body{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script>
        (function(){
            function adjustFlexOnWindowResize(element){
                console.log("adjustFlexOnWindowResize")
                if (window.innerWidth < 1000) {
                    console.log("mobile")
                    element.style.flexDirection = data.flex_direction_mobile
                    element.style.justifyContent = "center"
                    element.style.alignItems = "left"
                } else {
                    console.log("desktop")
                    element.style.flexDirection = data.flex_direction
                    element.style.flexWrap = "wrap"
                    // element.style.gridTemplateColumns = "auto auto"
                }
            }
            function init(data){
                console.log("flex ", data)
                const element = document.getElementById(`${data.id}`)
                element.style.display = "flex"
                element.style.flexWrap = "wrap"
                element.style.flexDirection = data.flex_direction ? data.flex_direction : "row"
                element.style.justifyContent = "center"
                element.style.justifyItems = "center"
                element.style.alignItems = "center"
                element.style.alignContent = "center"
                element.style.alignSelf = "center"
                element.style.gap = data.gap
                element.style.paddingBottom = "10vh"
                element.style.margin = "auto"
                element.style.backgroundColor = data.background_color ? data.background_color : "none"
                element.style.setProperty("color", data.text_color ? data.text_color : "var(--text)", 'important')
                
                window.onresize =() => {
                    // alert("resize")
                    adjustFlexOnWindowResize(element)
                }

                window.addEventListener("scroll", () => {
                    const items = element.children;

                    items.forEach((item, index) => {
                        // Fix the alignment and margins
                        item.style.alignSelf = 'center';
                        item.style.margin = 'auto';
                    })
                    // Grab all the items in your list
                })
                adjustFlexOnWindowResize(element)
            }

            window.componentRegistry.register("flex_box", init)
        })()
    </script>
</div>
